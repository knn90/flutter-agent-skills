# Provenance + curation for the flutter-tdd skill.
# Maintained by flutter-skill-consolidate — do not hand-edit pinned_commit / last_synced.

skill: flutter-tdd
domain: Test-driven development discipline (red-green-refactor, prove-it, vertical slices) — process, not framework mechanics
last_consolidated: 2026-07-08

# Scope note: framework SEMANTICS (flutter_test / package:test syntax, doubles, golden/integration,
# flakiness) are OWNED by flutter-testing-expert. flutter-tdd consolidates the *process* only and
# cross-links there. Keep the two from overlapping when re-consolidating.

discovery:
  enabled: true
  queries:
    - "test-driven development agent skill"
    - "TDD red green refactor best practices"
    - "tracer bullet vertical slice TDD"
    - "test behavior not implementation"
    - "DAMP not DRY tests"
  authority_anchors:
    - "Kent Beck — Test-Driven Development by Example"
    - "Google Testing Blog / Software Engineering at Google — test sizes, DAMP, state vs interaction"
    - "Martin Fowler — test double taxonomy, refactoring"

sources:
  # ── Community sources (both MIT, methodology references) ──
  - name: addyosmani/agent-skills — test-driven-development
    url: https://github.com/addyosmani/agent-skills
    path: skills/test-driven-development/
    status: active
    pinned_commit: TBD          # pin on first flutter-skill-consolidate run
    last_synced: 2026-07-08
    license: MIT
    note: >
      Primary structural source — TDD cycle, Prove-It pattern, test pyramid + test sizes,
      good-test rules (state-not-interaction, DAMP, real>mocks, AAA), anti-patterns,
      rationalizations, red flags. Browser/DevTools-specific sections DROPPED (not Flutter-relevant)
      — replaced by run-the-suite / device-emulator guidance.

  - name: mattpocock/skills — engineering/tdd
    url: https://github.com/mattpocock/skills
    path: skills/engineering/tdd/
    also:
      - https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/tests.md       # → references/tests.md
      - https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/mocking.md     # → references/mocking.md
      - https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/refactoring.md # → references/refactoring.md
    status: active
    pinned_commit: TBD          # pin on first flutter-skill-consolidate run
    last_synced: 2026-07-08
    license: MIT
    note: >
      Source for the vertical-slice / tracer-bullet framing (horizontal slicing as the cardinal
      anti-pattern), "never refactor while RED", behavior-through-public-interface emphasis, and
      the plan-the-behaviors / you-can't-test-everything planning step. The three companion files
      (tests/mocking/refactoring) were rewritten Dart-native into references/ — mocking.md keeps
      the *decision* (boundaries + DI + focused interfaces) and defers the double taxonomy +
      mocktail/mockito mechanics to flutter-testing-expert §4 to avoid duplication.

# ── Notes ──
# Examples were rewritten Dart-native (test()/expect, integer minor units, state-holder-not-widget).
# Framework mechanics deliberately deferred to flutter-testing-expert to avoid duplication.
